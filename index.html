        <script>
            const fileInput = document.getElementById('csvFileInput');

            fileInput.onchange = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const csvText = await file.text();

                const coinDicts = processCSV(csvText);

                console.log(coinDicts)

                coinDicts.forEach(coinDict => setCoinValue(coinDict))

                setPMintFont()

                /*Make the flips visible after they're filled with the csv data*/
                document.getElementById('allFlips').classList.remove('hidden')

            }

            function processCSV(csvText) {
                const rows = csvText.trim().split('\n');
                
                /*Get rows based on what they contain*/
                const headerRow = rows[0]; 
                const dataRows = rows.slice(1);
                
                /*Get individual headers and clean them*/
                const headers = headerRow.split(',').map(header => header.trim());
                
                /*Get an array of clean coin data arrays*/
                const coinDataLists = dataRows.map(dataRow => dataRow.split(',').map(dataValue => dataValue.trim()));

                /*Pair each member (value) of the coin data arrays with the associated header (key) in two member arrays*/
                const headerPairs = coinDataLists.map(dataList => dataList.map((data, index) => [headers[index], data || '']))

                /*This magic javascript function takes the data/header pairs and makes them into dicts (javascript Objects)*/
                return headerPairs.map(pairs => Object.fromEntries(pairs))

            }

            function setCoinValue(coinDict) {
                
                /*Pick the working flip based on the coordinates given in the csv*/ 
                const flip = document.getElementById(coinDict['Flip']);

                flip.style.setProperty('--coin-size', coinDict['Window Size'])

                /*Set all the notes since they all have the same class*/
                const notes = flip.querySelectorAll('.note')
                notes[0].innerHTML = coinDict['Top Note'];
                notes[1].innerHTML = coinDict['Center Note'];
                notes[2].innerHTML = coinDict['Bottom Note A'];
                notes[3].innerHTML = coinDict['Bottom Note B'];

                /*Set all the unique classes*/
                flip.querySelector('.year').innerHTML = coinDict['Year'];
                flip.querySelector('.mint').innerHTML = coinDict['Mint'];
                flip.querySelector('.flag').src = `flags/${coinDict['Flag']}.png`;
                flip.querySelector('.id').innerHTML = `#${coinDict['ID']}`;
            
                /*If guidelines are turned off, hides them*/
                const circle = flip.querySelector('.circle')
                    if (coinDict['Guideline'] == 'off') {
                        circle.classList.add('hide-guide')
                    }

            }

            /*"P" looks bad for the font I'm using for mint. If it is P, changes the font*/
            function setPMintFont(){

                const mints = document.querySelectorAll('.mint');

                mints.forEach((mint) => {
                    if (mint.innerHTML == 'P') {

                        mint.classList.add('p')

                    }
                })


            }

        </script>
